<form [formGroup]="charForm" (ngSubmit)="onSubmit()">
  <div class="mb-2">
    <label class="form-label small">Name</label>
    <input type="text" class="form-control form-control-sm" formControlName="name" placeholder="Character Name">
  </div>
  
  <div class="mb-2">
    <label class="form-label small">Description</label>
    <input type="text" class="form-control form-control-sm" formControlName="description" placeholder="Short description">
  </div>

  <div class="row mb-2">
    <div class="col-6">
      <label class="form-label small">Color</label>
      <input type="color" class="form-control form-control-color w-100" formControlName="color" title="Choose color">
    </div>
    <div class="col-6 d-flex align-items-center">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="isNarrator" formControlName="isNarrator">
        <label class="form-check-label small" for="isNarrator">
          Is Narrator?
        </label>
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-sm btn-success w-100" [disabled]="charForm.invalid || isSubmitting">
    {{ isSubmitting ? 'Saving...' : 'Save Character' }}
  </button>
</form>
